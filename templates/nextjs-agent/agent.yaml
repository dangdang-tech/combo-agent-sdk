# Agent 与平台之间的契约文件。fork 本模板后保持本文件与代码一致；平台发布管线按它做准入检查。
# 字段语义见平台技术方案第四节（构建套件 / agent.yaml）。
name: nextjs-agent-template

# 容器运行契约：监听端口与探针路径。
port: 3000
healthz: /api/healthz

# 资源基线（单副本起步值，平台按信号扩容）。
resources:
  request: { cpu: 250m, memory: 256Mi }
  limit: { cpu: 500m, memory: 512Mi }

# 环境变量只声明名字，值存平台 Secret，Git 不落真实值。
# 当前 COMBO_PLATFORM_INTERNAL_TOKEN 仍是验证期共享内部凭据，只能用于受控环境，
# 不能对外安全使用。目标 per-Agent、短期、限权凭据尚待 Combo 后端实现。
env:
  - COMBO_AGENT_ID
  - COMBO_PLATFORM_INTERNAL_TOKEN
  - COMBO_LLM_GATEWAY_URL
  - COMBO_BILLING_URL
  - COMBO_JWKS_URL

# 声明用到的平台能力，是切面注入点。本模板用到 llm、entitlement 与 payment；
# storage 能力在 Agent 真正接入托管存储时再声明。
capabilities:
  - llm
  - entitlement
  - payment
